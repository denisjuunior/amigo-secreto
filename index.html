<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle de Obra</title>
<meta name="theme-color" content="#E8590C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obra">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E8590C;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;padding-top:env(safe-area-inset-top)}
#splash{position:fixed;inset:0;background:#E8590C;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s;z-index:5}
#splash img{width:96px;height:96px;border-radius:22px}
#splash.off{opacity:0;pointer-events:none}
#fallback{display:none;margin-top:10px;background:#fff;color:#E8590C;padding:12px 20px;border-radius:10px;font-weight:700;text-decoration:none}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:#1f2937;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:10px;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:14px}
#bar span{flex:1}
#bar button{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
#bInst{background:#E8590C;color:#fff}
#bFecha{background:transparent;color:#cbd5e1}
</style>
</head>
<body>
<iframe id="app" title="Controle de Obra" allow="camera; clipboard-write; fullscreen"></iframe>
<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <b style="font-size:20px">Controle de Obra</b>
  <span style="opacity:.85">Carregando…</span>
  <a id="fallback" href="#" target="_top">Abrir o sistema</a>
</div>
<div id="bar"><span id="bTxt">Instalar o app na tela inicial?</span><button id="bInst">Instalar</button><button id="bFecha">✕</button></div>
<script>
// >>> URL do Web App (Apps Script). Troque aqui se fizer novo deploy. <<<
const APP_URL="https://script.google.com/macros/s/AKfycbz3lOQwZbBXjzYR8-Vx4QcdH8laDNObn_g-ZYBV1GUi8atmC1QOHMyod1sXY3ch7A53/exec";

const f=document.getElementById('app'),sp=document.getElementById('splash'),fb=document.getElementById('fallback');
const q=new URLSearchParams(location.search);          // repassa ?pg=...&acao=novo (atalhos)
f.src=APP_URL+(q.toString()?'?'+q.toString():'');
f.onload=()=>sp.classList.add('off');
fb.href=f.src;
setTimeout(()=>{ if(!sp.classList.contains('off')) fb.style.display='inline-block'; },8000);

// Navegação entre páginas sem sair da casca (evita o aviso do Google)
addEventListener('message',e=>{
  const d=e.data; if(!d||typeof d.obraNav!=='string')return;
  if(!/(script\.google\.com|googleusercontent\.com)$/.test(new URL(e.origin).hostname))return;
  sp.classList.remove('off'); fb.style.display='none';
  f.src=APP_URL+'?pg='+encodeURIComponent(d.obraNav).replace('%26','&').replace('%3D','=');
});

// Service worker (necessário para instalar)
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

// Instalação automática
const bar=document.getElementById('bar'),bTxt=document.getElementById('bTxt'),bI=document.getElementById('bInst');
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
let ev=null;
const dispensado=()=>{try{return localStorage.getItem('obraInst')==='1'}catch(e){return false}};
document.getElementById('bFecha').onclick=()=>{bar.style.display='none';try{localStorage.setItem('obraInst','1')}catch(e){}};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;if(!standalone&&!dispensado())bar.style.display='flex';});
bI.onclick=async()=>{ if(!ev)return; ev.prompt(); await ev.userChoice; ev=null; bar.style.display='none'; };
addEventListener('appinstalled',()=>{bar.style.display='none'});
// iPhone/iPad: não existe prompt, mostra instrução
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone&&!dispensado()){
  bTxt.textContent='Para instalar: toque em Compartilhar ⬆️ e depois "Adicionar à Tela de Início".';
  bI.style.display='none'; bar.style.display='flex';
}
</script>
</body>
</html>
